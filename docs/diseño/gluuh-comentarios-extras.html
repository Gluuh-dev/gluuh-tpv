<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gluuh · Comentarios y extras</title>
<!--
  Gluuh TPV — Comentarios, opciones y extras de un artículo. Pantalla completa.
  Las opciones pueden ser gratis (0,00 €) o subir el precio. Los grupos OBLIGATORIO no dejan guardar.
  Tema CLARO, mismo lenguaje que cobro, dividir, invitaciones y utilidades.
  Fichero único, sin red: CSS aquí, logo en base64, JS plano sin librerías.
  Tipografía: fuentes del sistema. Recomendada si se instala en el terminal: "Inter Tight". No se enlaza a propósito.
-->
<style>
  :root{
    --gluuh:#572370; --gluuh-lit:#7C3D9B; --gluuh-pale:#F3EDF7;
    --bg:#F1F2F5; --panel:#FFFFFF; --panel-2:#F7F8FA;
    --ink:#1E2430; --ink-2:#4A5262; --muted:#8A93A3;
    --line:#E1E5EA; --line-2:#CFD5DE;
    --verde:#0E9F6E; --verde-pale:#E7F7F1;
    --amber:#F5A623; --amber-pale:#FDF1DC;
    --naranja:#F08A1D; --rojo:#D64545;
    --r:10px; --tap:56px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--ink);
    font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px;
    -webkit-font-smoothing:antialiased;user-select:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
  input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--gluuh-lit);outline-offset:2px;border-radius:7px}
  .tab{font-variant-numeric:tabular-nums}
  .app{height:100%;display:flex;flex-direction:column}

  /* ═════ cabecera ═════ */
  .head{
    flex:none;height:70px;background:var(--gluuh);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;
  }
  .head img{height:38px;width:auto;flex:none}
  .art{
    display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:9px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  }
  .art b{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .art small{font-size:12.5px;color:#D8BEE9;font-weight:600}
  .art svg{width:16px;height:16px;stroke:#D8BEE9;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .art:active{background:rgba(255,255,255,.24)}
  .uds{
    margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;
    background:rgba(0,0,0,.22);
  }
  .uds span{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#D8BEE9;padding-right:2px}
  .uds button{
    width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.16);
    display:grid;place-items:center;font-size:24px;font-weight:800;
  }
  .uds button:active{background:rgba(255,255,255,.34)}
  .uds button[disabled]{opacity:.35;cursor:default}
  .uds b{font-size:24px;font-weight:800;min-width:32px;text-align:center}
  .tot{text-align:right;padding-left:8px}
  .tot small{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#D8BEE9;font-weight:800}
  .tot b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05}

  /* ═════ cuerpo ═════ */
  .body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 384px;gap:12px;padding:12px}
  .caja{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .caja > h2{
    flex:none;display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line);
    font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;
  }
  .caja > h2 .n{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-2)}
  .scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px}

  /* ── grupos de comentarios ── */
  .grupo{margin-bottom:20px}
  .grupo:last-child{margin-bottom:4px}
  .grupo h3{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px;
    font-size:15px;font-weight:800;letter-spacing:-.01em;
  }
  .grupo h3::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--gluuh-lit);flex:none}
  .grupo h3 em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--muted)}
  .obl{
    font-size:10px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:999px;
    background:var(--amber-pale);color:#9A6A12;border:1px solid #F0D9A8;
  }
  .grupo.falta h3::before{background:var(--amber)}
  .ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px}
  .op{
    min-height:var(--tap);border-radius:9px;border:1px solid var(--line-2);background:#fff;
    display:flex;align-items:center;gap:11px;padding:0 13px;font-size:14.5px;font-weight:600;
  }
  .op .mk{
    width:24px;height:24px;flex:none;border:2px solid var(--line-2);background:#fff;
    display:grid;place-items:center;border-radius:6px;
  }
  .op.uno .mk{border-radius:50%}
  .op .mk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .op .mk i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:0}
  .op .nm{flex:1;min-width:0;line-height:1.2}
  .op .pr{font-size:12.5px;font-weight:800;color:var(--naranja);white-space:nowrap}
  .op:active{background:var(--gluuh-pale)}
  .op[aria-pressed="true"]{border-color:var(--gluuh);background:var(--gluuh-pale);box-shadow:0 0 0 3px var(--gluuh-pale)}
  .op[aria-pressed="true"] .mk{background:var(--gluuh);border-color:var(--gluuh)}
  .op[aria-pressed="true"] .mk svg,.op[aria-pressed="true"] .mk i{opacity:1}
  .op[aria-pressed="true"] .nm{font-weight:800}

  /* ── extras ── */
  .ex-lista{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .ex{
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
    border:1px solid var(--line-2);border-radius:9px;padding:9px 10px 9px 13px;background:#fff;
  }
  .ex.puesto{border-color:var(--naranja);background:#FFF8EE;box-shadow:0 0 0 3px #FDF1DC}
  .ex .nm{font-size:14.5px;font-weight:700;line-height:1.2}
  .ex .pr{font-size:12px;font-weight:800;color:var(--naranja);margin-top:2px}
  .ex .pr.free{color:var(--verde)}
  .st{display:flex;align-items:center;gap:6px}
  .st button{
    width:46px;height:46px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);
    display:grid;place-items:center;font-size:23px;font-weight:800;
  }
  .st button:active{background:var(--line)}
  .st button[disabled]{opacity:.35;cursor:default}
  .ex.puesto .st button{background:var(--amber-pale);border-color:#F0D9A8;color:#9A6A12}
  .st b{font-size:19px;font-weight:800;min-width:26px;text-align:center}

  /* ── desglose ── */
  .desglose{
    flex:none;border-top:1px solid var(--line);background:var(--panel-2);padding:12px 14px;
    display:flex;flex-direction:column;gap:5px;
  }
  .dl{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
  .dl b{font-weight:700}
  .dl.recargo b{color:var(--naranja)}
  .dl.fin{
    margin-top:5px;padding-top:9px;border-top:1px solid var(--line-2);align-items:baseline;
    font-size:14px;font-weight:800;color:var(--ink);
  }
  .dl.fin b{font-size:26px;letter-spacing:-.02em}

  /* ═════ pie ═════ */
  .foot{flex:none;display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel);border-top:1px solid var(--line)}
  .fb{
    min-height:var(--tap);padding:0 22px;border-radius:9px;font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:9px;flex:none;
  }
  .fb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .fb.cancel{border:1px solid var(--line-2);background:#fff;color:var(--ink-2)}
  .fb.cancel:active{background:var(--panel-2)}
  .fb.manual{border:1px dashed var(--gluuh-lit);color:var(--gluuh);background:#fff;max-width:340px}
  .fb.manual:active{background:var(--gluuh-pale)}
  .fb.manual.puesto{border-style:solid;background:var(--gluuh-pale)}
  .fb.manual .txt{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fb.guardar{
    background:linear-gradient(180deg,#FBB03B,var(--naranja));color:#fff;font-size:18px;font-weight:800;
    padding:0 34px;min-height:60px;box-shadow:0 10px 26px -12px rgba(240,138,29,.8);
  }
  .fb.guardar:active{filter:brightness(.95)}
  .fb.guardar[disabled]{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2);box-shadow:none;cursor:default}
  .foot .avisos{flex:1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .aviso{
    display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;
    background:var(--amber-pale);border:1px solid #F0D9A8;color:#9A6A12;font-size:13.5px;font-weight:800;
  }
  .aviso svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
  .aviso.ok{background:var(--verde-pale);border-color:#B9E6D4;color:#0A6B4A}

  /* ═════ diálogos ═════ */
  dialog{border:0;padding:0;background:transparent;max-width:min(520px,94vw)}
  dialog::backdrop{background:rgba(30,36,48,.55)}
  .sheet{background:var(--panel);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px -24px rgba(0,0,0,.55)}
  .m-head{height:56px;background:var(--gluuh);color:#fff;display:flex;align-items:center;padding:0 16px;font-size:18px;font-weight:700}
  .m-body{padding:14px;display:flex;flex-direction:column;gap:10px}
  .m-body p{font-size:13px;color:var(--muted);line-height:1.45}
  .m-body input{
    width:100%;min-height:var(--tap);border:1px solid var(--line-2);border-radius:8px;padding:0 14px;
    background:#fff;font-size:16px;
  }
  .m-body input:focus{outline:none;border-color:var(--gluuh-lit);box-shadow:0 0 0 3px var(--gluuh-pale)}
  .m-foot{display:flex;gap:8px;padding:12px 14px;background:var(--panel-2);border-top:1px solid var(--line)}
  .m-foot button{flex:1;min-height:var(--tap);border-radius:8px;font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  .m-foot .no{border:1px solid var(--line-2);background:#fff;color:var(--ink-2)}
  .m-foot .si{background:var(--gluuh);color:#fff}
  .lista-art{padding:12px;display:flex;flex-direction:column;gap:7px;max-height:60vh;overflow-y:auto}
  .la{
    display:flex;align-items:center;gap:12px;min-height:60px;padding:0 14px;border-radius:9px;
    border:1px solid var(--line-2);background:#fff;font-size:15px;font-weight:700;
  }
  .la small{margin-left:auto;font-size:14px;font-weight:800;color:var(--naranja)}
  .la:active{background:var(--gluuh-pale)}
  .la[aria-current="true"]{border-color:var(--gluuh);background:var(--gluuh-pale)}

  .toast{
    position:fixed;left:50%;bottom:88px;transform:translate(-50%,220%);
    background:var(--ink);color:#fff;padding:14px 24px;border-radius:999px;
    font-size:15px;font-weight:600;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);transition:transform .25s;z-index:99;
    max-width:min(760px,92vw);text-align:center;line-height:1.4;
  }
  .toast.on{transform:translate(-50%,0)}

  @media (max-width:1150px){
    .body{grid-template-columns:1fr 320px}
    .ops{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
    .fb.manual .txt{display:none}
  }
  @media (max-width:900px){
    html,body{height:auto;overflow:auto}
    .body{grid-template-columns:1fr}
    .caja{min-height:340px}
    .foot{flex-wrap:wrap}
    .head{height:auto;flex-wrap:wrap;padding:10px 12px;gap:10px}
    .uds{margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

        <div class="dl recargo"><span>Extras</span><b class="tab" id="d-ex">—</b></div>
        <div class="dl fin"><span>Total de la línea</span><b class="tab" id="d-fin">0,00 €</b></div>
      </div>
    </section>
  </div>

  <!-- ═════ pie ═════ -->
  <footer class="foot">
    <button class="fb cancel" id="b-cancelar">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Cancelar
    </button>
    <button class="fb manual" id="b-manual">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M8 10h8M8 14h5"/></svg>
      <span>Comentario manual</span>
      <span class="txt" id="manual-txt" hidden></span>
    </button>
    <div class="avisos" id="avisos"></div>
    <button class="fb guardar" id="b-guardar">Guardar y añadir al ticket</button>
  </footer>
</div>

<!-- comentario manual -->
<dialog id="m-manual">
  <div class="sheet">
    <div class="m-head">Comentario manual</div>
    <div class="m-body">
      <p>Sale impreso en la comanda de cocina, justo debajo del artículo. Para lo que no está en la lista.</p>
      <input id="manual-input" type="text" maxlength="80" placeholder="Ej.: la carne bien pasada, es para un niño">
    </div>
    <div class="m-foot">
      <button class="no" id="man-cancel">Cancelar</button>
      <button class="si" id="man-ok">Guardar comentario</button>
    </div>
  </div>
</dialog>

<!-- selector de artículo -->
<dialog id="m-art">
  <div class="sheet">
    <div class="m-head">Artículo</div>
    <div class="lista-art" id="lista-art"></div>
    <div class="m-foot"><button class="no" id="art-cancel">Cancelar</button></div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
/* ══ carta configurable ══ */
const CARTA = [
  {
    nm:'Hamburguesa clásica', fam:'Hamburguesas', pr:8.50,
    grupos:[
      {t:'Punto de la carne', uno:true, obl:true, op:[['Poco hecha',0],['Al punto',0],['Hecha',0],['Muy hecha',0]]},
      {t:'Guarnición', uno:true, obl:true, op:[['Patatas fritas',0],['Ensalada',0],['Patatas deluxe',1.20],['Sin guarnición',0]]},
      {t:'Pan', uno:true, op:[['Pan normal',0],['Pan brioche',0.40],['Pan sin gluten',0.50],['Sin pan',0]]},
      {t:'Alergias e intolerancias', op:[['Sin gluten',0],['Sin lactosa',0],['Alergia a frutos secos',0],['Sin huevo',0]]},
      {t:'Preparación', op:[['Bien caliente',0],['Para compartir',0],['Sin sal',0],['Salsa aparte',0]]}
    ],
    extras:[['Bacon',1.00],['Queso cheddar',1.00],['Huevo frito',1.00],['Cebolla caramelizada',1.00],
            ['Doble carne',2.50],['Aguacate',1.50],['Jalapeños',0.60],['Roquefort',1.20],
            ['Salsa barbacoa',0],['Salsa brava',0],['Pepinillos',0],['Extra de patatas',1.80]]
  },
  {
    nm:'Entrecot', fam:'Carnes', pr:12.00,
    grupos:[
      {t:'Punto de la carne', uno:true, obl:true, op:[['Poco hecho',0],['Al punto',0],['Muy hecho',0]]},
      {t:'Salsa', uno:true, op:[['Sin salsa',0],['Más salsa',0],['Salsa aparte',0]]},
      {t:'Guarnición', uno:true, obl:true, op:[['Patatas fritas',0],['Pimientos',0],['Ensalada',0],['Patatas deluxe',1.20]]},
      {t:'Alergias e intolerancias', op:[['Sin gluten',0],['Sin lactosa',0],['Sin huevo',0]]}
    ],
    extras:[['Pimienta',0],['Roquefort',1.20],['Barbacoa',0],['Extra de patatas',1.80],['Huevo frito',1.00]]
  },
  {
    nm:'Pizza barbacoa', fam:'Pizzas', pr:10.00,
    grupos:[
      {t:'Masa', uno:true, obl:true, op:[['Masa fina',0],['Masa gruesa',0],['Masa sin gluten',1.50]]},
      {t:'Cómo la parto', uno:true, op:[['En 8 porciones',0],['En 4 porciones',0],['Sin partir',0]]},
      {t:'Alergias e intolerancias', op:[['Sin lactosa',0],['Sin cerdo',0],['Alergia a frutos secos',0]]}
    ],
    extras:[['Extra de queso',1.20],['Bacon',1.00],['Champiñones',0.80],['Sin cebolla',0],['Sin orégano',0],['Doble barbacoa',0.60]]
  },
  {
    nm:'Serranito', fam:'Bocadillos', pr:5.50,
    grupos:[
      {t:'Punto de la carne', uno:true, obl:true, op:[['Poco hecho',0],['Al punto',0],['Muy hecho',0]]},
      {t:'Alergias e intolerancias', op:[['Sin gluten',0],['Sin cerdo',0]]},
      {t:'Preparación', op:[['Sin pimiento',0],['Sin tomate',0],['Con mucho ajo',0],['Para compartir',0]]}
    ],
    extras:[['Queso',1.00],['Huevo frito',1.00],['Doble lomo',2.50],['Mayonesa',0]]
  }
];

const eur = n => (n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const rec = n => n > 0 ? '+' + eur(n) : 'Sin coste';

/* ══ estado ══ */
let iArt = 0, uds = 1, elegidas = {}, extras = {}, manual = '';
const art = () => CARTA[iArt];

/* ══ cargar artículo ══ */
function carga(i){
  iArt = i; uds = 1; elegidas = {}; extras = {}; manual = '';
  document.getElementById('h-nm').textContent = art().nm;
  document.getElementById('h-fam').textContent = art().fam + ' · ' + eur(art().pr);
  document.getElementById('b-manual').classList.remove('puesto');
  document.getElementById('manual-txt').hidden = true;

  const g = document.getElementById('grupos');
  g.innerHTML = '';
  art().grupos.forEach((gr,gi)=>{
    const d = document.createElement('div');
    d.className = 'grupo'; d.dataset.g = gi;
    d.innerHTML = `<h3>${gr.t}
      <em>${gr.uno ? '· elige uno' : '· marca los que hagan falta'}</em>
      ${gr.obl ? '<span class="obl">OBLIGATORIO</span>' : ''}</h3>`;
    const ops = document.createElement('div');
    ops.className = 'ops';
    gr.op.forEach(([nm,pr])=>{
      const b = document.createElement('button');
      b.className = 'op' + (gr.uno ? ' uno' : '');
      b.dataset.g = gi; b.dataset.n = nm;
      b.setAttribute('aria-pressed','false');
      b.innerHTML = `<span class="mk">${gr.uno ? '<i></i>' : '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'}</span>
        <span class="nm">${nm}</span>${pr > 0 ? `<span class="pr tab">+${eur(pr)}</span>` : ''}`;
      b.onclick = ()=>{
        if(gr.uno){
          const ya = elegidas[gi] && elegidas[gi][0] === nm;
          elegidas[gi] = ya ? null : [nm, pr];
        } else {
          const k = gi + '|' + nm;
          elegidas[k] = elegidas[k] ? null : [nm, pr];
        }
        pinta();
      };
      ops.appendChild(b);
    });
    d.appendChild(ops);
    g.appendChild(d);
  });
  document.getElementById('c-n').textContent = art().grupos.length + ' grupos';

  const e = document.getElementById('extras');
  e.innerHTML = '';
  art().extras.forEach(([nm,pr])=>{
    const d = document.createElement('div');
    d.className = 'ex'; d.dataset.n = nm;
    d.innerHTML = `<div><div class="nm">${nm}</div><div class="pr tab ${pr?'':'free'}">${rec(pr)}</div></div>
      <div class="st">
        <button aria-label="Quitar ${nm}">−</button><b class="tab">0</b><button aria-label="Añadir ${nm}">+</button>
      </div>`;
    const [menos, mas] = d.querySelectorAll('button');
    menos.onclick = ()=>{ extras[nm] = Math.max((extras[nm]||0) - 1, 0); pinta(); };
    mas.onclick = ()=>{ extras[nm] = Math.min((extras[nm]||0) + 1, 9); pinta(); };
    e.appendChild(d);
  });
  document.getElementById('e-n').textContent = art().extras.length + ' extras';
  document.getElementById('grupos').scrollTop = 0;
  document.getElementById('extras').scrollTop = 0;
  pinta();
}

/* ══ cálculo ══ */
const opsElegidas = ()=> Object.values(elegidas).filter(Boolean);
const recargoOps = ()=> opsElegidas().reduce((s,[,pr])=> s + pr, 0);
const recargoExtras = ()=> Object.entries(extras).reduce((s,[nm,u])=>{
  const e = art().extras.find(x => x[0] === nm);
  return s + (e ? e[1]*u : 0);
}, 0);
const total = ()=> (art().pr + recargoOps()) * uds + recargoExtras();
const faltan = ()=> art().grupos.map((gr,gi)=> gr.obl && !elegidas[gi] ? gr.t : null).filter(Boolean);

function pinta(){
  document.querySelectorAll('.op').forEach(b=>{
    const gi = b.dataset.g, nm = b.dataset.n, gr = art().grupos[gi];
    const on = gr.uno ? (elegidas[gi] && elegidas[gi][0] === nm) : !!elegidas[gi + '|' + nm];
    b.setAttribute('aria-pressed', !!on);
  });
  document.querySelectorAll('#extras .ex').forEach(d=>{
    const u = extras[d.dataset.n] || 0;
    d.querySelector('b').textContent = u;
    d.classList.toggle('puesto', u > 0);
    d.querySelectorAll('button')[0].disabled = u === 0;
  });
  document.getElementById('u-n').textContent = uds;
  document.getElementById('u-menos').disabled = uds <= 1;

  // desglose
  const ro = recargoOps(), re = recargoExtras();
  document.getElementById('d-base-lb').textContent = 'Artículo' + (uds > 1 ? ' × ' + uds : '');
  document.getElementById('d-base').textContent = eur(art().pr * uds);
  document.getElementById('d-ops').textContent = ro ? '+ ' + eur(ro * uds) : '—';
  document.getElementById('d-ex').textContent = re ? '+ ' + eur(re) : '—';
  document.getElementById('d-fin').textContent = eur(total());
  document.getElementById('h-total').textContent = eur(total());

  // avisos y grupos que faltan
  const f = faltan();
  document.querySelectorAll('.grupo').forEach(d=>{
    const gr = art().grupos[d.dataset.g];
    // ojo: classList.toggle con undefined alterna, no fuerza. Hay que pasar un booleano de verdad.
    d.classList.toggle('falta', !!(gr.obl && !elegidas[d.dataset.g]));
  });
  const $a = document.getElementById('avisos');
  $a.innerHTML = '';
  if(f.length){
    f.forEach(t=>{
      const d = document.createElement('div');
      d.className = 'aviso';
      d.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 17.5A1.9 1.9 0 0 0 4 20.4h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/></svg> Elige ${t}`;
      $a.appendChild(d);
    });
  } else {
    const n = opsElegidas().length, x = Object.values(extras).reduce((s,u)=> s+u, 0);
    const d = document.createElement('div');
    d.className = 'aviso ok';
    d.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      Listo · ${n} ${n === 1 ? 'opción' : 'opciones'}${x ? ' y ' + x + ' extras' : ''}`;
    $a.appendChild(d);
  }
  document.getElementById('b-guardar').disabled = f.length > 0;
}

/* ══ unidades ══ */
document.getElementById('u-mas').onclick = ()=>{ uds = Math.min(uds+1, 20); pinta(); };
document.getElementById('u-menos').onclick = ()=>{ uds = Math.max(uds-1, 1); pinta(); };

/* ══ comentario manual ══ */
const mM = document.getElementById('m-manual');
document.getElementById('b-manual').onclick = ()=>{
  document.getElementById('manual-input').value = manual;
  mM.showModal(); document.getElementById('manual-input').focus();
};
document.getElementById('man-ok').onclick = ()=>{
  manual = document.getElementById('manual-input').value.trim();
  const b = document.getElementById('b-manual'), s = document.getElementById('manual-txt');
  b.classList.toggle('puesto', !!manual);
  s.hidden = !manual; s.textContent = manual ? '«' + manual + '»' : '';
  mM.close();
};
document.getElementById('man-cancel').onclick = ()=> mM.close();

/* ══ selector de artículo ══ */
const mA = document.getElementById('m-art');
document.getElementById('b-art').onclick = ()=>{
  const c = document.getElementById('lista-art');
  c.innerHTML = '';
  CARTA.forEach((a,i)=>{
    const b = document.createElement('button');
    b.className = 'la';
    b.setAttribute('aria-current', i === iArt);
    b.innerHTML = `${a.nm}<small class="tab">${eur(a.pr)}</small>`;
    b.onclick = ()=>{ mA.close(); carga(i); };
    c.appendChild(b);
  });
  mA.showModal();
};
document.getElementById('art-cancel').onclick = ()=> mA.close();

/* ══ guardar ══ */
document.getElementById('b-cancelar').onclick = ()=> avisa('Volviendo al ticket sin añadir nada');
document.getElementById('b-guardar').onclick = ()=>{
  const ops = opsElegidas().map(([nm,pr]) => nm + (pr ? ' (+' + eur(pr) + ')' : ''));
  const exs = Object.entries(extras).filter(([,u]) => u > 0).map(([nm,u])=>{
    const pr = art().extras.find(x => x[0] === nm)[1];
    return nm + (u > 1 ? ' ×' + u : '') + (pr ? ' (+' + eur(pr*u) + ')' : '');
  });
  avisa(uds + ' × ' + art().nm + ' · ' + eur(total()) +
    (ops.length ? ' · ' + ops.join(', ') : '') +
    (exs.length ? ' · con ' + exs.join(', ') : '') +
    (manual ? ' · «' + manual + '»' : ''));
};

/* ══ avisos ══ */
const $toast = document.getElementById('toast'); let tt;
function avisa(t){
  $toast.textContent = t; $toast.classList.add('on');
  clearTimeout(tt); tt = setTimeout(()=> $toast.classList.remove('on'), 3000);
}

carga(0);
</script>
</body>
</html>
