<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gluuh · Pasar a mesa</title>
<!--
  Gluuh TPV — Seleccionar mesa para asignar el ticket. Sale sobre el TPV, pensado para 1024×768.
  Plano de verdad (no rejilla de botones): cada sala con sus mesas colocadas, barra, cocina y aseos.
  El plano es un lienzo virtual de 1000×560 que se escala al hueco, así que las proporciones no bailan.
  Avisa de lo que pasa al soltar el ticket: juntar cuentas, mesa de otro camarero, mesa reservada.
  Fichero único, sin red: CSS aquí, logo en base64, JS plano sin librerías.
  Tipografía: fuentes del sistema. Recomendada si se instala en el terminal: "Inter Tight". No se enlaza a propósito.
-->
<style>
  :root{
    --gluuh:#572370; --gluuh-lit:#7C3D9B; --gluuh-pale:#F4EFF7;
    --bg:#E9EBEF; --panel:#FFFFFF; --panel-2:#F6F7F9;
    --ink:#1B212B; --ink-2:#48505E; --muted:#858D9B;
    --line:#DFE3E8; --line-2:#C8CFD8;
    --verde:#0B8F62; --verde-pale:#E6F5EF;
    --amber:#E9971A; --amber-pale:#FCF2E0;
    --naranja:#EA8118; --rojo:#CE3D3D; --rojo-pale:#FCEBEB;
    --azul:#2C6BBF; --azul-pale:#EAF1FB;
    --suelo:#F2F4F7; --pared:#D8DDE4;
    --r:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;
    -webkit-font-smoothing:antialiased;user-select:none;letter-spacing:-.005em}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
  :focus-visible{outline:2px solid var(--gluuh-lit);outline-offset:2px;border-radius:4px}
  .tab{font-variant-numeric:tabular-nums}
  .lb{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

  /* ═════ TPV de fondo ═════ */
  .tpv{height:100%;display:grid;grid-template-columns:306px 1fr;gap:6px;padding:6px}
  .caja{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0}
  .tk-h{flex:none;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-bottom:1px solid var(--line)}
  .tk-h img{height:20px} .tk-h b{font-size:12.5px;font-weight:800}
  .tk-h small{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:700}
  .lineas{flex:1;min-height:0;overflow-y:auto;padding:4px}
  .lin{display:grid;grid-template-columns:1fr 26px 60px;gap:6px;padding:6px 7px;font-size:12.5px;border-bottom:1px solid var(--line)}
  .lin b{font-weight:700} .lin .n{text-align:right;font-weight:600}
  .tot{flex:none;border-top:1px solid var(--line);background:var(--panel-2);padding:6px 10px;display:flex;align-items:baseline;justify-content:space-between}
  .tot b{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .mesa-b{flex:none;margin:6px;min-height:48px;border-radius:var(--r);border:1px dashed var(--gluuh-lit);background:var(--gluuh-pale);
    color:var(--gluuh);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:800}
  .mesa-b svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
  .mesa-b.puesto{border-style:solid;background:#fff}
  .prods{flex:1;min-height:0;overflow:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:78px;gap:5px;align-content:start}
  .pr{border-radius:5px;border:1px solid rgba(0,0,0,.16);color:#fff;background:var(--azul);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;text-transform:uppercase;text-align:center;padding:5px}
  .pr.c{background:#B93A30} .pr .p{font-size:11.5px;font-weight:700;opacity:.9;text-transform:none}

  /* ═════ modal ═════ */
  dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none}
  dialog::backdrop{background:rgba(20,25,33,.6)}
  #m-mesa{width:100vw;height:100vh}
  #m-mesa .sheet{position:absolute;inset:10px;background:var(--panel);border-radius:8px;overflow:hidden;
    box-shadow:0 26px 70px -16px rgba(0,0,0,.6);display:flex;flex-direction:column}
  .m-head{flex:none;height:52px;background:var(--gluuh);color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px}
  .m-head img{height:26px;flex:none}
  .m-head h1{font-size:17px;font-weight:800}
  .m-head .sub{font-size:11px;color:#CBAFDC;font-weight:700}
  .m-head .der{margin-left:auto;display:flex;align-items:center;gap:14px}
  .m-head .k{text-align:right}
  .m-head .k small{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#CBAFDC;font-weight:800}
  .m-head .k b{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .x{width:36px;height:36px;border-radius:5px;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;flex:none}
  .x svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
  .x:active{background:rgba(255,255,255,.2)}

  .m-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px;gap:8px;padding:8px}
  .izq{display:flex;flex-direction:column;min-height:0;min-width:0;gap:8px}
  .izq > .pnl{flex:1;min-height:0}
  .pnl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0}
  .pnl > h2{flex:none;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-bottom:1px solid var(--line);
    background:var(--panel-2);font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
  .pnl > h2 .n{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:600;font-size:11px}

  /* ── salas ── */
  .salas{flex:none;display:flex;gap:5px}
  .sa{
    flex:1;min-height:52px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);
    display:flex;align-items:center;gap:9px;padding:0 10px;
  }
  .sa svg{width:18px;height:18px;stroke:var(--gluuh);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .sa .d{flex:1;min-width:0}
  .sa .d b{display:block;font-size:12.5px;font-weight:800;line-height:1.2}
  .sa .d small{font-size:10px;color:var(--muted);font-weight:700}
  .sa:active{background:var(--gluuh-pale)}
  .sa[aria-selected="true"]{background:var(--gluuh);border-color:var(--gluuh);color:#fff}
  .sa[aria-selected="true"] svg{stroke:#fff}
  .sa[aria-selected="true"] .d small{color:#CBAFDC}
  .sa .bd{font-size:9.5px;font-weight:800;background:var(--rojo);color:#fff;border-radius:999px;padding:1px 6px;min-width:17px;text-align:center;flex:none}

  /* ── plano ── */
  .plano-caja{flex:1;min-height:0;overflow:hidden;position:relative;background:var(--suelo)}
  .plano{position:absolute;top:0;left:0;width:1000px;height:560px;transform-origin:top left}
  .deco{
    position:absolute;border-radius:5px;background:var(--pared);border:1px solid #C4CBD4;
    display:flex;align-items:center;justify-content:center;color:#6C7683;
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  }
  .deco.puerta{background:transparent;border:0;border-top:4px dashed var(--line-2);border-radius:0;color:var(--muted);font-size:12px;align-items:flex-start;padding-top:5px}
  .ms{
    position:absolute;border-radius:7px;border:2px solid var(--line-2);background:var(--panel);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;text-align:center;
  }
  .ms.red{border-radius:50%}
  .ms .n{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .ms .pax{font-size:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:3px}
  .ms .pax svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2.4}
  .ms .im{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .ms .t{font-size:9.5px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
  .ms .cam{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;font-size:9px;font-weight:800;
    display:grid;place-items:center;border:2px solid #fff;background:var(--ink-2);color:#fff}
  .ms:active{filter:brightness(.97)}
  /* estados */
  .ms.libre{background:var(--panel);border-color:var(--line-2);border-style:dashed}
  .ms.libre .n{color:var(--muted)}
  .ms.mia{background:var(--gluuh);border-color:var(--gluuh-dk,#3F1953);color:#fff}
  .ms.mia .pax{color:#CBAFDC}
  .ms.mia .cam{background:#fff;color:var(--gluuh)}
  .ms.otro{background:var(--azul-pale);border-color:#9EC0EA}
  .ms.otro .n,.ms.otro .im{color:#1D4F91}
  .ms.otro .cam{background:var(--azul)}
  .ms.res{background:var(--amber-pale);border-color:#EFCE8A;border-style:dashed}
  .ms.res .n{color:#8A5B0B} .ms.res .t{color:#8A5B0B}
  .ms.larga::after{content:"";position:absolute;top:5px;left:5px;width:7px;height:7px;border-radius:50%;background:var(--rojo)}
  .ms[aria-selected="true"]{box-shadow:0 0 0 4px var(--naranja);z-index:3}
  .ms.esta{opacity:.5;pointer-events:none}
  .ms.esta::before{content:"AQUÍ";position:absolute;bottom:3px;font-size:8px;font-weight:800;letter-spacing:.1em;color:var(--muted)}

  /* ── leyenda ── */
  .ley{flex:none;display:flex;align-items:center;gap:12px;padding:7px 10px;border-top:1px solid var(--line);background:var(--panel)}
  .ley .i{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink-2)}
  .ley .c{width:13px;height:13px;border-radius:3px;border:2px solid var(--line-2);background:#fff;border-style:dashed;flex:none}
  .ley .c.mia{background:var(--gluuh);border-color:var(--gluuh);border-style:solid}
  .ley .c.otro{background:var(--azul-pale);border-color:#9EC0EA;border-style:solid}
  .ley .c.res{background:var(--amber-pale);border-color:#EFCE8A}
  .ley .c.larga{background:#fff;border-style:solid;position:relative}
  .ley .c.larga::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--rojo)}
  .ley .z{margin-left:auto;display:flex;gap:4px}
  .ley .z button{width:32px;height:28px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);display:grid;place-items:center}
  .ley .z svg{width:13px;height:13px;stroke:var(--ink-2);fill:none;stroke-width:2.4;stroke-linecap:round}

  /* ── detalle ── */
  .det{flex:1;min-height:0;overflow-y:auto;padding:10px}
  .det .cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .det .cab .num{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none;
    border:2px solid var(--line-2);background:var(--panel-2)}
  .det .cab .num.mia{background:var(--gluuh);border-color:var(--gluuh);color:#fff}
  .det .cab .num.otro{background:var(--azul-pale);border-color:#9EC0EA;color:#1D4F91}
  .det .cab .num.res{background:var(--amber-pale);border-color:#EFCE8A;color:#8A5B0B}
  .det .cab b{font-size:15px;font-weight:800;line-height:1.2;display:block}
  .det .cab small{font-size:11px;color:var(--muted);font-weight:600}
  .av-r{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:5px;font-size:11.5px;font-weight:700;line-height:1.4;margin-bottom:6px}
  .av-r svg{width:14px;height:14px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2.2}
  .av-r.ok{background:var(--verde-pale);border:1px solid #BCE3D3;color:#07684A}
  .av-r.ojo{background:var(--amber-pale);border:1px solid #F0DCA9;color:#8A5B0B}
  .av-r.mal{background:var(--rojo-pale);border:1px solid #F0C6C6;color:#9C2B2B}
  .av-r.info{background:var(--azul-pale);border:1px solid #C6DAF3;color:#1D4F91}
  .dt{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .dt .l{width:76px;flex:none;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .dt .v{flex:1;font-weight:700}
  .dt .v.no{color:var(--line-2);font-weight:500;font-style:italic}
  .pax-st{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px solid var(--line-2);border-radius:5px}
  .pax-st .d{flex:1}
  .pax-st .d b{display:block;font-size:12px;font-weight:800}
  .pax-st .d small{font-size:10px;color:var(--muted);font-weight:600}
  .pax-st .st{display:flex;align-items:center;gap:5px}
  .pax-st button{width:38px;height:38px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line-2);
    display:grid;place-items:center;font-size:18px;font-weight:800}
  .pax-st button:active{background:var(--gluuh-pale)}
  .pax-st b.n{font-size:17px;font-weight:800;min-width:22px;text-align:center}
  .sin{margin:auto;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;padding:24px}
  .sin b{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:3px}
  .resu{margin-top:10px;padding:9px 10px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
  .resu .r{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--ink-2)}
  .resu .r b{font-weight:800}
  .resu .r.fin{margin-top:5px;padding-top:6px;border-top:1px solid var(--line-2);font-size:13px;font-weight:800;color:var(--ink)}
  .resu .r.fin b{font-size:18px;letter-spacing:-.02em}

  /* ── pie ── */
  .m-foot{flex:none;display:flex;align-items:center;gap:6px;padding:8px;background:var(--panel-2);border-top:1px solid var(--line)}
  .fb{min-height:48px;padding:0 16px;border-radius:var(--r);font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
  .fb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .fb.gris{border:1px solid var(--line-2);background:#fff;color:var(--ink-2)}
  .fb.mor{border:1px solid var(--gluuh);background:#fff;color:var(--gluuh)}
  .fb.ok{background:var(--naranja);border:1px solid #D2710E;color:#fff;font-size:15px;min-height:52px;padding:0 22px;
    box-shadow:0 6px 16px -8px rgba(234,129,24,.9)}
  .fb.ok[disabled]{background:var(--panel-2);border-color:var(--line-2);color:var(--muted);box-shadow:none;cursor:default}
  .nota{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);
    font-size:11.5px;font-weight:700;line-height:1.35;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
  .nota.ok{background:var(--verde-pale);border-color:#BCE3D3;color:#07684A}
  .nota.ojo{background:var(--amber-pale);border-color:#F0DCA9;color:#8A5B0B}
  .nota svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,240%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 14px 32px -12px rgba(0,0,0,.6);
    transition:transform .22s;z-index:99;max-width:min(680px,92vw);text-align:center;line-height:1.4}
  .toast.on{transform:translate(-50%,0)}

  @media (max-width:1100px){ .m-body{grid-template-columns:1fr 262px} .ley .i:nth-child(n+5){display:none} }
  @media (max-width:900px){
    html,body{height:auto;overflow:auto}
    .tpv{grid-template-columns:1fr} .m-body{grid-template-columns:1fr}
    #m-mesa .sheet{position:relative;inset:auto;margin:8px}
    .plano-caja{height:420px} .m-foot{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

        </section>
      </div>

      <section class="pnl">
        <h2>Mesa elegida <span class="n" id="d-n">—</span></h2>
        <div class="det" id="det"></div>
      </section>
    </div>

    <footer class="m-foot">
      <button class="fb gris" id="b-cancelar">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> Cancelar
      </button>
      <button class="fb mor" id="b-libre">
        <svg viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></svg> Primera libre
      </button>
      <div class="nota" id="nota"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-5M12 8h.01"/></svg>
        <span id="nota-tx">Toca la mesa donde se sientan.</span></div>
      <button class="fb ok" id="b-asignar" disabled>Asignar</button>
    </footer>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
/* ══ salas y mesas ══ lienzo virtual 1000×560 ══ */
const IC = {
  salon:'<circle cx="12" cy="12" r="4"/><circle cx="12" cy="3.6" r="1.5"/><circle cx="12" cy="20.4" r="1.5"/><circle cx="3.6" cy="12" r="1.5"/><circle cx="20.4" cy="12" r="1.5"/>',
  terraza:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',
  barra:'<path d="M3 4h18v3l-7 5v7H10v-7L3 7V4Z"/>',
  reser:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
const SALAS = [
  {id:'salon', nm:'Salón', ic:IC.salon,
   deco:[[40,18,470,58,'Barra'],[620,18,340,58,'Cocina'],[800,470,160,72,'Aseos'],[380,528,180,32,'Entrada','puerta']],
   mesas:[
    {n:'1',  x:60,  y:130, w:120, h:110, pax:4},
    {n:'2',  x:200, y:130, w:120, h:110, pax:4},
    {n:'3',  x:340, y:130, w:120, h:110, pax:4},
    {n:'4',  x:480, y:130, w:120, h:110, pax:4},
    {n:'5',  x:640, y:118, w:140, h:140, pax:6, red:1},
    {n:'6',  x:820, y:130, w:120, h:110, pax:4},
    {n:'7',  x:60,  y:290, w:120, h:110, pax:4},
    {n:'8',  x:200, y:290, w:120, h:110, pax:4},
    {n:'9',  x:340, y:278, w:140, h:140, pax:6, red:1},
    {n:'10', x:520, y:290, w:120, h:110, pax:4},
    {n:'11', x:660, y:290, w:120, h:110, pax:4},
    {n:'12', x:820, y:290, w:120, h:110, pax:4},
    {n:'13', x:60,  y:450, w:90,  h:90,  pax:2},
    {n:'14', x:170, y:450, w:90,  h:90,  pax:2},
    {n:'15', x:280, y:450, w:90,  h:90,  pax:2}
   ]},
  {id:'terraza', nm:'Terraza', ic:IC.terraza,
   deco:[[40,18,920,40,'Fachada'],[40,510,920,50,'Acera','puerta']],
   mesas:[
    {n:'T1', x:70,  y:100, w:110, h:110, pax:2, red:1},
    {n:'T2', x:220, y:100, w:110, h:110, pax:2, red:1},
    {n:'T3', x:370, y:100, w:110, h:110, pax:2, red:1},
    {n:'T4', x:520, y:100, w:110, h:110, pax:2, red:1},
    {n:'T5', x:670, y:100, w:110, h:110, pax:2, red:1},
    {n:'T6', x:820, y:100, w:110, h:110, pax:2, red:1},
    {n:'T7', x:70,  y:300, w:150, h:120, pax:6},
    {n:'T8', x:280, y:300, w:150, h:120, pax:6},
    {n:'T9', x:490, y:300, w:150, h:120, pax:6},
    {n:'T10',x:700, y:290, w:140, h:140, pax:8, red:1}
   ]},
  {id:'barra', nm:'Barra', ic:IC.barra,
   deco:[[60,120,880,120,'Barra'],[60,20,880,60,'Botellero']],
   mesas:[
    {n:'B1', x:90,  y:300, w:90, h:90, pax:1, red:1},
    {n:'B2', x:210, y:300, w:90, h:90, pax:1, red:1},
    {n:'B3', x:330, y:300, w:90, h:90, pax:1, red:1},
    {n:'B4', x:450, y:300, w:90, h:90, pax:1, red:1},
    {n:'B5', x:570, y:300, w:90, h:90, pax:1, red:1},
    {n:'B6', x:690, y:300, w:90, h:90, pax:1, red:1},
    {n:'B7', x:810, y:300, w:90, h:90, pax:1, red:1}
   ]}
];
/* estado de cada mesa: libre / mia / otro / res */
const EST = {
  '1':{e:'mia', im:23.40, min:38, px:2}, '2':{e:'libre'}, '3':{e:'otro', im:56.80, min:64, px:4, cam:'JO'},
  '4':{e:'libre'}, '5':{e:'otro', im:112.50, min:147, px:6, cam:'JO'}, '6':{e:'libre'},
  '7':{e:'mia', im:8.60, min:12, px:2}, '8':{e:'res', hora:'21:30', px:4, nombre:'Ortega'},
  '9':{e:'otro', im:74.20, min:95, px:5, cam:'LM'}, '10':{e:'libre'}, '11':{e:'libre'},
  '12':{e:'res', hora:'22:00', px:6, nombre:'Peña Bética'}, '13':{e:'libre'}, '14':{e:'mia', im:4.60, min:9, px:1}, '15':{e:'libre'},
  'T1':{e:'libre'}, 'T2':{e:'otro', im:18.40, min:41, px:2, cam:'RJ'}, 'T3':{e:'libre'},
  'T4':{e:'mia', im:31.20, min:22, px:2}, 'T5':{e:'libre'}, 'T6':{e:'libre'},
  'T7':{e:'otro', im:96.00, min:132, px:6, cam:'RJ'}, 'T8':{e:'libre'}, 'T9':{e:'libre'},
  'T10':{e:'res', hora:'21:00', px:8, nombre:'Cumpleaños Ruiz'},
  'B1':{e:'libre'}, 'B2':{e:'libre'}, 'B3':{e:'mia', im:6.40, min:7, px:1}, 'B4':{e:'libre'},
  'B5':{e:'libre'}, 'B6':{e:'libre'}, 'B7':{e:'libre'}
};
const CAMS = {JO:'Javier Ortega', LM:'Lucía Moreno', RJ:'Rosa Jiménez', MR:'María Ruiz'};
const AHORA = 20 * 60 + 45;   // 20:45
const hm = m => (m >= 60 ? Math.floor(m/60) + ' h ' : '') + (m % 60) + ' min';
const eur = n => (n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const num = n => (n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const aMin = h =>{ const [a,b] = h.split(':').map(Number); return a*60 + b; };

/* ══ ticket ══ */
let ticket = [
  {nm:'Croquetas caseras', pr:4.50, u:2}, {nm:'Patatas bravas', pr:6.00, u:1},
  {nm:'Jamón ibérico', pr:18.00, u:1}, {nm:'Caña', pr:1.80, u:4}, {nm:'Coca-Cola', pr:2.00, u:2}
];
let miMesa = null, salaAct = 0, sel = null, pax = 3, zoom = 1;
const total = ()=> ticket.reduce((s,l)=> s + l.pr*l.u, 0);
const mesaDe = n => SALAS.flatMap(s => s.mesas.map(m => ({...m, sala:s}))).find(m => m.n === n);

function pintaTPV(){
  document.getElementById('lineas').innerHTML = ticket.map(l=>
    `<div class="lin"><b>${l.nm}</b><span class="n tab">${l.u}</span><span class="n tab">${num(l.pr*l.u)}</span></div>`).join('');
  document.getElementById('t-total').textContent = eur(total());
  document.getElementById('h-total').textContent = eur(total());
  document.getElementById('h-sub').textContent = ticket.length + ' artículos · ' + (miMesa ? 'mesa ' + miMesa : 'barra');
  document.getElementById('tk-sub').textContent = miMesa ? 'Mesa ' + miMesa + ' · ' + pax + ' pax' : 'Barra · sin mesa';
  const b = document.getElementById('mesa-b');
  b.classList.toggle('puesto', !!miMesa);
  document.getElementById('mesa-tx').textContent = miMesa ? 'Mesa ' + miMesa + ' · cambiar' : 'Pasar a mesa';
  document.getElementById('prods').innerHTML = [['Croquetas',4.50,'c'],['Bravas',6.00,'c'],['Jamón',18.00,'c'],
    ['Caña',1.80,''],['Coca-Cola',2.00,''],['Agua',1.50,'']].map(([n,p,t])=>
    `<div class="pr ${t}">${n}<span class="p tab">${num(p)}</span></div>`).join('');
}

/* ══ salas ══ */
const $s = document.getElementById('salas');
SALAS.forEach((s,i)=>{
  const libres = s.mesas.filter(m => EST[m.n].e === 'libre').length;
  const b = document.createElement('button');
  b.className = 'sa';
  b.setAttribute('aria-selected', i === 0);
  b.innerHTML = `<svg viewBox="0 0 24 24">${s.ic}</svg>
    <span class="d"><b>${s.nm}</b><small>${libres} libres de ${s.mesas.length}</small></span>
    ${s.mesas.length - libres ? `<span class="bd">${s.mesas.length - libres}</span>` : ''}`;
  b.onclick = ()=>{
    salaAct = i; sel = null;
    [...$s.children].forEach((x,j)=> x.setAttribute('aria-selected', j === i));
    pintaPlano(); pintaDet();
  };
  $s.appendChild(b);
});

/* ══ plano ══ */
function pintaPlano(){
  const s = SALAS[salaAct], $p = document.getElementById('plano');
  $p.innerHTML = '';
  s.deco.forEach(([x,y,w,h,tx,cl])=>{
    const d = document.createElement('div');
    d.className = 'deco ' + (cl || '');
    d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    d.textContent = tx;
    $p.appendChild(d);
  });
  s.mesas.forEach(m=>{
    const e = EST[m.n];
    const b = document.createElement('button');
    const larga = e.min > 120;
    b.className = 'ms ' + e.e + (m.red ? ' red' : '') + (larga ? ' larga' : '') + (miMesa === m.n ? ' esta' : '');
    b.style.cssText = `left:${m.x}px;top:${m.y}px;width:${m.w}px;height:${m.h}px`;
    b.setAttribute('aria-selected', sel === m.n);
    const cuerpo = e.e === 'libre'
      ? `<span class="pax"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>${m.pax}</span>`
      : e.e === 'res'
        ? `<span class="t">${e.hora} · ${e.px}p</span>`
        : `<span class="im">${num(e.im)}</span><span class="t">${hm(e.min)} · ${e.px}p</span>`;
    b.innerHTML = `<span class="n">${m.n}</span>${cuerpo}
      ${e.cam ? `<span class="cam">${e.cam}</span>` : e.e === 'mia' ? '<span class="cam">MR</span>' : ''}`;
    b.onclick = ()=>{ sel = sel === m.n ? null : m.n; pintaPlano(); pintaDet(); };
    $p.appendChild(b);
  });
  escala();
}
function escala(){
  const c = document.getElementById('plano-caja'), p = document.getElementById('plano');
  const k = Math.min(c.clientWidth / 1000, c.clientHeight / 560) * zoom;
  const x = Math.max(0, (c.clientWidth - 1000*k) / 2), y = Math.max(0, (c.clientHeight - 560*k) / 2);
  p.style.transform = `translate(${x}px,${y}px) scale(${k})`;
  c.style.overflow = zoom > 1 ? 'auto' : 'hidden';
}
addEventListener('resize', escala);
document.getElementById('z-mas').onclick = ()=>{ zoom = Math.min(2, zoom + .25); escala(); };
document.getElementById('z-menos').onclick = ()=>{ zoom = Math.max(1, zoom - .25); escala(); };

/* ══ detalle ══ */
const ICO = {
  ojo:'<circle cx="12" cy="12" r="9.5"/><path d="M12 16v-5M12 8h.01"/>',
  mal:'<path d="M12 9v4M12 17h.01M10.3 3.9 2.4 17.5A1.9 1.9 0 0 0 4 20.4h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/>',
  ok:'<path d="M20 6 9 17l-5-5"/>'
};
function pintaDet(){
  const $d = document.getElementById('det');
  if(!sel){
    document.getElementById('d-n').textContent = '—';
    $d.innerHTML = `<div class="sin"><b>Ninguna mesa elegida</b>Toca en el plano la mesa donde se sientan.
      Las de línea discontinua están libres.</div>`;
    pie(); return;
  }
  const m = mesaDe(sel), e = EST[sel];
  document.getElementById('d-n').textContent = m.sala.nm;
  const nombreEst = {libre:'Libre', mia:'Tuya, abierta', otro:'De ' + (CAMS[e.cam]||'otro'), res:'Reservada'}[e.e];
  const av = [];
  if(e.e === 'libre'){
    av.push(`<div class="av-r ok"><svg viewBox="0 0 24 24">${ICO.ok}</svg><span>Libre. El ticket se abre aquí con ${pax} comensales.</span></div>`);
    if(pax > m.pax) av.push(`<div class="av-r ojo"><svg viewBox="0 0 24 24">${ICO.ojo}</svg><span>La mesa es de ${m.pax}: vas a sentar ${pax}. Mira si te cuadra o junta dos mesas.</span></div>`);
  }
  if(e.e === 'mia'){
    av.push(`<div class="av-r ojo"><svg viewBox="0 0 24 24">${ICO.mal}</svg><span>Ya tiene un ticket tuyo de ${eur(e.im)}. Si sigues, se juntan las dos cuentas en una.</span></div>`);
  }
  if(e.e === 'otro'){
    av.push(`<div class="av-r info"><svg viewBox="0 0 24 24">${ICO.ojo}</svg><span>La lleva ${CAMS[e.cam]} y tiene ${eur(e.im)}. Al juntarla, la mesa pasa a tu nombre y a ti la comisión.</span></div>`);
  }
  if(e.e === 'res'){
    const falta = aMin(e.hora) - AHORA;
    av.push(`<div class="av-r ${falta < 60 ? 'mal' : 'ojo'}"><svg viewBox="0 0 24 24">${ICO.mal}</svg>
      <span>Reservada a las ${e.hora} para ${e.px} a nombre de ${e.nombre}. ${falta > 0 ? 'Faltan ' + hm(falta) + '.' : 'Ya deberían estar.'}</span></div>`);
  }
  if(e.min > 120) av.push(`<div class="av-r ojo"><svg viewBox="0 0 24 24">${ICO.ojo}</svg><span>Lleva ${hm(e.min)} abierta. Igual está para cobrar.</span></div>`);

  const datos = e.e === 'libre'
    ? `<div class="dt"><span class="l">Sitios</span><span class="v">${m.pax} comensales</span></div>
       <div class="dt"><span class="l">Sala</span><span class="v">${m.sala.nm}</span></div>
       <div class="dt"><span class="l">Estado</span><span class="v">Libre desde hace rato</span></div>`
    : e.e === 'res'
      ? `<div class="dt"><span class="l">A nombre</span><span class="v">${e.nombre}</span></div>
         <div class="dt"><span class="l">Hora</span><span class="v tab">${e.hora}</span></div>
         <div class="dt"><span class="l">Personas</span><span class="v">${e.px}</span></div>
         <div class="dt"><span class="l">Sitios</span><span class="v">${m.pax}</span></div>`
      : `<div class="dt"><span class="l">Camarero</span><span class="v">${e.e === 'mia' ? 'Tú' : CAMS[e.cam]}</span></div>
         <div class="dt"><span class="l">Abierta</span><span class="v tab">${hm(e.min)}</span></div>
         <div class="dt"><span class="l">Comensales</span><span class="v">${e.px} de ${m.pax}</span></div>
         <div class="dt"><span class="l">Lleva</span><span class="v tab">${eur(e.im)}</span></div>`;

  const junta = (e.e === 'mia' || e.e === 'otro');
  $d.innerHTML = `<div class="cab"><span class="num ${e.e === 'libre' ? '' : e.e}">${sel}</span>
      <span><b>Mesa ${sel}</b><small>${m.sala.nm} · ${nombreEst}</small></span></div>
    ${av.join('')}
    <div class="datos">${datos}</div>
    ${e.e === 'libre' || e.e === 'res' ? `<div class="pax-st">
      <div class="d"><b>Comensales</b><small>Se guarda en la mesa</small></div>
      <div class="st"><button id="p-menos">−</button><b class="n tab">${pax}</b><button id="p-mas">+</button></div>
    </div>` : ''}
    ${junta ? `<div class="resu">
      <div class="r"><span>Lo que hay en la mesa ${sel}</span><b class="tab">${num(e.im)}</b></div>
      <div class="r"><span>Este ticket</span><b class="tab">${num(total())}</b></div>
      <div class="r fin"><span>Cuenta junta</span><b class="tab">${eur(e.im + total())}</b></div>
    </div>` : ''}`;
  const pm = document.getElementById('p-menos'), pM = document.getElementById('p-mas');
  if(pm) pm.onclick = ()=>{ pax = Math.max(1, pax-1); pintaDet(); };
  if(pM) pM.onclick = ()=>{ pax++; pintaDet(); };
  pie();
}

/* ══ pie ══ */
function pie(){
  const $n = document.getElementById('nota-tx'), $nota = document.getElementById('nota'), $b = document.getElementById('b-asignar');
  $nota.className = 'nota';
  if(!sel){
    $b.disabled = true; $b.textContent = 'Asignar';
    $n.textContent = 'Toca la mesa donde se sientan. «Primera libre» te coloca en la que toque.';
    return;
  }
  const e = EST[sel];
  $b.disabled = false;
  if(e.e === 'libre'){
    $b.textContent = 'Abrir la mesa ' + sel;
    $nota.className = 'nota ok';
    $n.textContent = 'El ticket de ' + eur(total()) + ' pasa a la mesa ' + sel + ' con ' + pax + ' comensales.';
  } else if(e.e === 'res'){
    $b.textContent = 'Sentar en la ' + sel;
    $nota.className = 'nota ojo';
    $n.textContent = 'Está reservada a las ' + e.hora + ' (' + e.nombre + '). Si los sientas aquí, avisa o cambia la reserva.';
  } else {
    $b.textContent = 'Juntar con la ' + sel;
    $nota.className = 'nota ojo';
    $n.textContent = 'Se juntan las dos cuentas: ' + eur(e.im) + ' + ' + eur(total()) + ' = ' + eur(e.im + total()) +
      (e.e === 'otro' ? '. La mesa deja de ser de ' + CAMS[e.cam] + '.' : '.');
  }
}

/* ══ acciones ══ */
document.getElementById('b-asignar').onclick = ()=>{
  const e = EST[sel], m = mesaDe(sel);
  if(e.e === 'libre' || e.e === 'res'){
    EST[sel] = {e:'mia', im:total(), min:0, px:pax};
    miMesa = sel;
    avisa('Ticket de ' + eur(total()) + ' en la mesa ' + sel + ' · ' + pax + ' comensales' +
      (e.e === 'res' ? ' · ojo: tenía reserva a las ' + e.hora : ''));
  } else {
    const antes = e.im;
    EST[sel] = {e:'mia', im:antes + total(), min:e.min, px:Math.max(e.px, pax)};
    miMesa = sel;
    avisa('Cuentas juntas en la mesa ' + sel + ': ' + eur(antes) + ' + ' + eur(total()) + ' = ' + eur(antes + total()));
  }
  ticket = []; sel = null;
  pintaTPV(); document.getElementById('m-mesa').close();
};
document.getElementById('b-libre').onclick = ()=>{
  const s = SALAS[salaAct];
  const cabe = s.mesas.filter(m => EST[m.n].e === 'libre' && m.pax >= pax);
  const cual = cabe[0] || s.mesas.find(m => EST[m.n].e === 'libre');
  if(!cual) return avisa('No queda ninguna mesa libre en ' + s.nm);
  sel = cual.n; pintaPlano(); pintaDet();
  avisa('Mesa ' + cual.n + ' · ' + cual.pax + ' sitios' + (cabe.length ? '' : ' (no llega para ' + pax + ', es la única libre)'));
};
document.getElementById('b-cancelar').onclick = ()=> document.getElementById('m-mesa').close();
document.getElementById('m-x').onclick = ()=> document.getElementById('m-mesa').close();
document.getElementById('mesa-b').onclick = ()=>{
  sel = null; zoom = 1;
  if(!ticket.length) return avisa('El ticket está vacío: no hay nada que pasar a una mesa');
  document.getElementById('m-mesa').showModal();
  pintaPlano(); pintaDet();
};

const $toast = document.getElementById('toast'); let tt;
function avisa(t){
  $toast.textContent = t; $toast.classList.add('on');
  clearTimeout(tt); tt = setTimeout(()=> $toast.classList.remove('on'), 3200);
}

pintaTPV();
</script>
</body>
</html>
