<?xml version="1.0" encoding="UTF-8"?>
<svg id="Capa_2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 329.68 329">
  <defs>
