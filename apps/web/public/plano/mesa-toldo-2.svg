    <rect fill="var(--silla-fill,#5e4c34)" x="128.84" y="288.5" width="72" height="34" rx="9" ry="9" />
    <rect fill="var(--silla-fill,#5e4c34)" x="6.84" y="128.5" width="34" height="72" rx="9" ry="9" />
    <rect fill="var(--silla-fill,#5e4c34)" x="288.84" y="128.5" width="34" height="72" rx="9" ry="9" />
    
