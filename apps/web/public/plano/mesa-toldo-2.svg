    <!-- Colorful Mediterranean Parasol / Sombrilla Canopy -->
    <g clip-path="url(#toldo2-clippath)">
      <!-- Panel 1 (Top - Light grey/white) -->
      <polygon fill="#e9ebea" points="165.84 161.67 86.68 18.69 246.11 16.32 165.84 161.67" />

      <!-- Panel 2 (Top-Right - Yellow) -->
