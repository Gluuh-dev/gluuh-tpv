<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Drip Tray / Rejilla de goteo (Acero cepillado) -->
  <circle cx="100" cy="100" r="85" fill="#cbd5e1" stroke="#94a3b8" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Drip Tray Slots / Rejillas -->
  <line x1="60" y1="80" x2="140" y2="80" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="90" x2="150" y2="90" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="45" y1="100" x2="155" y2="100" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="110" x2="150" y2="110" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="120" x2="140" y2="120" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="75" y1="130" x2="125" y2="130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Beer Tower Column base / Columna del grifo (Cromado circular) -->
  <circle cx="100" cy="100" r="30" fill="#cbd5e1" stroke="#64748b" stroke-width="3" />
  <circle cx="100" cy="100" r="26" fill="#e2e8f0" />
  <!-- Gloss highlight -->
  <path d="M 85,85 A 26,26 0 0 1 115,85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Tap 1 (Left Tap nozzle & handle) -->
  <rect x="58" y="94" width="20" height="12" rx="3" fill="#64748b" />
  <!-- Tap handle (Black) -->
  <line x1="58" y1="100" x2="35" y2="100" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
  <circle cx="33" cy="100" r="6" fill="#0f172a" />

  <!-- Tap 2 (Right Tap nozzle & handle) -->
  <rect x="122" y="94" width="20" height="12" rx="3" fill="#64748b" />
  <!-- Tap handle (Black) -->
  <line x1="142" y1="100" x2="165" y2="100" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
  <circle cx="167" cy="100" r="6" fill="#0f172a" />
  
  <!-- Central Cap -->
  <circle cx="100" cy="100" r="10" fill="#94a3b8" />
  <circle cx="100" cy="100" r="6" fill="#cbd5e1" />
</svg>
