<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Base Sand Color (Warm Beach Yellow/Beige) -->
  <rect width="100" height="100" fill="#ebd49f" />
  
  <!-- Subtle organic sand grain dots -->
  <circle cx="15" cy="25" r="1" fill="#d6b570" opacity="0.6" />
  <circle cx="42" cy="78" r="1.2" fill="#d6b570" opacity="0.6" />
  <circle cx="85" cy="18" r="1" fill="#d6b570" opacity="0.6" />
  <circle cx="68" cy="55" r="1.5" fill="#d6b570" opacity="0.4" />
  <circle cx="28" cy="60" r="0.8" fill="#d6b570" opacity="0.6" />
  <circle cx="90" cy="85" r="1.2" fill="#d6b570" opacity="0.5" />
  
  <!-- Gentle sand wave/ripple lines -->
  <path d="M -10,35 Q 25,20 50,35 T 110,35" fill="none" stroke="#f5e6c4" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M -10,75 Q 25,60 50,75 T 110,75" fill="none" stroke="#f5e6c4" stroke-width="2" stroke-linecap="round" opacity="0.6" />
