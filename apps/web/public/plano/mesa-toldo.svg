<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Sillas (pegadas a la mesa, estilo premium) -->
  <!-- Top chair -->
  <path d="M 158,52 C 158,30 242,30 242,52 L 236,52 C 236,36 164,36 164,52 Z" fill="var(--silla-dark,#4B4D52)" />
  <rect x="164" y="42" width="72" height="34" rx="9" fill="var(--silla-fill,#707378)" />
  <!-- Bottom chair -->
  <path d="M 158,348 C 158,370 242,370 242,348 L 236,348 C 236,364 164,364 164,348 Z" fill="var(--silla-dark,#4B4D52)" />
  <rect x="164" y="324" width="72" height="34" rx="9" fill="var(--silla-fill,#707378)" />
  <!-- Left chair -->
  <path d="M 52,158 C 30,158 30,242 52,242 L 52,236 C 36,236 36,164 52,164 Z" fill="var(--silla-dark,#4B4D52)" />
  <rect x="42" y="164" width="34" height="72" rx="9" fill="var(--silla-fill,#707378)" />
  <!-- Right chair -->
  <path d="M 348,158 C 370,158 370,242 348,242 L 348,236 C 364,236 364,164 348,164 Z" fill="var(--silla-dark,#4B4D52)" />
  <rect x="324" y="164" width="34" height="72" rx="9" fill="var(--silla-fill,#707378)" />
  
  <!-- Mesa Cuadrada en el fondo -->
  <rect x="80" y="80" width="240" height="240" rx="24" fill="var(--mesa-fill,#8a5a2b)" />
  
  <!-- Círculo de la Sombrilla encima (gajos alternados de color) -->
  <path d="M 200 200 L 325 200 A 125 125 0 0 1 288 288 Z" fill="var(--mesa-fill,#eab308)" />
  <path d="M 200 200 L 288 288 A 125 125 0 0 1 200 325 Z" fill="#f8fafc" />
  <path d="M 200 200 L 200 325 A 125 125 0 0 1 112 288 Z" fill="var(--mesa-fill,#eab308)" />
  <path d="M 200 200 L 112 288 A 125 125 0 0 1 75 200 Z" fill="#f8fafc" />
  <path d="M 200 200 L 75 200 A 125 125 0 0 1 112 112 Z" fill="var(--mesa-fill,#eab308)" />
  <path d="M 200 200 L 112 112 A 125 125 0 0 1 200 75 Z" fill="#f8fafc" />
  <path d="M 200 200 L 200 75 A 125 125 0 0 1 288 112 Z" fill="var(--mesa-fill,#eab308)" />
  <path d="M 200 200 L 288 112 A 125 125 0 0 1 325 200 Z" fill="#f8fafc" />

  <!-- Borde exterior de la sombrilla -->
  <circle cx="200" cy="200" r="125" fill="none" stroke="#ffffff" stroke-width="4" />
  
  <!-- Varillas de la sombrilla -->
  <line x1="200" y1="200" x2="200" y2="75" stroke="#ffffff" stroke-width="3" />
  <line x1="200" y1="200" x2="200" y2="325" stroke="#ffffff" stroke-width="3" />
  <line x1="200" y1="200" x2="75" y2="200" stroke="#ffffff" stroke-width="3" />
  <line x1="200" y1="200" x2="325" y2="200" stroke="#ffffff" stroke-width="3" />
  <line x1="200" y1="200" x2="112" y2="112" stroke="#ffffff" stroke-width="3" />
  <line x1="200" y1="200" x2="288" y2="288" stroke="#ffffff" stroke-width="3" />
  <line x1="200" y1="200" x2="112" y2="288" stroke="#ffffff" stroke-width="3" />
  <line x1="200" y1="200" x2="288" y2="112" stroke="#ffffff" stroke-width="3" />
  
  <!-- Tapa central -->
  <circle cx="200" cy="200" r="12" fill="#334155" />
</svg>
