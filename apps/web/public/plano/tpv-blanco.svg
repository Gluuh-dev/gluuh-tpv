  <rect x="70" y="200" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  <rect x="76" y="206" width="148" height="48" rx="4" fill="#7D419E" opacity="0.9" />
