  <circle cx="115" cy="300" r="8" fill="#10b981" />
  <circle cx="145" cy="300" r="8" fill="#ef4444" />
  <circle cx="175" cy="300" r="8" fill="#f59e0b" />
  <rect x="205" y="292" width="90" height="16" rx="4" fill="#cbd5e1" />
</svg>
