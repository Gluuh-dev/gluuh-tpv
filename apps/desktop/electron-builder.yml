# Empaquetado Windows (NSIS) + auto-update. Guía: docs/implementacion/03 §pieza 4.
appId: com.gluuh.tpv
productName: Gluuh TPV
directories:
  # FUERA del repositorio (TRAMPAS §5): dentro de Documents, el AV/OneDrive
  # agarra el .asar recien escrito y el empaquetado muere con EBUSY.
  output: C:/gluuh-paquete/tpv
files:
  - dist/**
  - package.json
  # Pantallas locales (van dentro de la app para cargar aunque el nodo esté apagado):
  # "Conectando…" (did-fail-load) y el primer arranque (IP + credencial del terminal).
  - esperando.html
  - conectar-terminal.html
win:
  target: nsis
  # El icono de Gluuh (morado, visible en oscuro). Sin esto, el TPV sale con el icono por
  # defecto de Electron y parece de cualquiera. build\icon.ico es el mismo del servidor.
  icon: build/icon.ico
nsis:
  # Instalador ASISTIDO (no one-click): así al terminar sale la página final con el check
  # "Ejecutar Gluuh TPV", que el usuario puede desmarcar si no quiere abrirlo aún. Con
  # one-click se instalaba y abría de golpe, sin preguntar.
  oneClick: false
  perMachine: false
  # Que no pida elegir carpeta: instala en el sitio por defecto y va directo al lío.
  allowToChangeInstallationDirectory: false
  # La página final ofrece abrir la app (check marcado; se puede desmarcar).
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # Accesos directos con el nombre bonito, en escritorio y menu inicio.
  shortcutName: Gluuh TPV
  # `always`: el acceso directo del escritorio se crea SIEMPRE — también al
  # reinstalar/actualizar (con `true`, si el usuario lo borró una vez, no vuelve;
  # y en un TPV de barra el acceso directo ES la forma de abrir la app).
  createDesktopShortcut: always
  createStartMenuShortcut: true
# Auto-update vía GitHub Releases. Ajustar owner/repo al publicar la primera release.
publish:
  provider: github
  owner: gluuh
  repo: tpv-sofware
# node-thermal-printer es JS puro: no hay nativos que recompilar.
npmRebuild: false
